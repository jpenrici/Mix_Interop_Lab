<!DOCTYPE html>
<!-- demo/public/ui/index.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Matrix multiplication</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Matrix multiplication</h1>
            <p class="subtitle">Python, PHP &amp; C++ low-latency environment</p>
        </header>

        <main>
            <form id="matrix-form" novalidate>
                <div class="matrix-grid">
                    <fieldset class="card matrix-input" data-matrix="a">
                        <legend>Matrix A</legend>
                        <label class="sr-only" for="matrix-a">Values of matrix A</label>
                        <textarea id="matrix-a" spellcheck="false" rows="8"
                                  placeholder="One row per line, values separated by commas or spaces&#10;1 2 3&#10;4 5 6"></textarea>
                        <div class="matrix-meta">
                            <label class="file-label">
                                Load CSV
                                <input type="file" accept=".csv,.tsv,.txt,text/csv,text/plain">
                            </label>
                            <span class="dims" aria-live="polite"></span>
                        </div>
                        <p class="field-error" role="alert" hidden></p>
                    </fieldset>

                    <fieldset class="card matrix-input" data-matrix="b">
                        <legend>Matrix B</legend>
                        <label class="sr-only" for="matrix-b">Values of matrix B</label>
                        <textarea id="matrix-b" spellcheck="false" rows="8"
                                  placeholder="Rows of B must equal columns of A&#10;7 8&#10;9 10&#10;11 12"></textarea>
                        <div class="matrix-meta">
                            <label class="file-label">
                                Load CSV
                                <input type="file" accept=".csv,.tsv,.txt,text/csv,text/plain">
                            </label>
                            <span class="dims" aria-live="polite"></span>
                        </div>
                        <p class="field-error" role="alert" hidden></p>
                    </fieldset>
                </div>

                <div class="actions">
                    <button type="submit" id="compute-btn" disabled>Multiply A × B</button>
                    <button type="reset" id="reset-btn" class="secondary">Clear</button>
                    <p id="compat" class="compat" aria-live="polite">Enter both matrices.</p>
                </div>
            </form>

            <section class="card results-card" aria-labelledby="result-title">
                <h2 id="result-title">Result</h2>
                <p id="status" class="status" role="status" hidden></p>
                <div id="output">
                    <p class="placeholder">No computation executed yet.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
