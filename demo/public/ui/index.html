<!-- demo/public/ui/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Project</h1>
            <p class="subtitle">Python, PHP & C Low-Latency Environment</p>
        </header>

        <main>
            <section class="card">
                <h2>Matrix Computation</h2>
                <p>Click the button below to load <code>matrix.csv</code> and process matrix multiplication via C FFI engine.</p>
                <button id="compute-btn" onclick="runComputation()">Compute Matrix</button>
            </section>

            <section class="card results-card">
                <h2>Result</h2>
                <div id="loading" class="hidden">Processing...</div>
                <div id="output-container">
                    <p class="placeholder">No computation executed yet.</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function runComputation() {
            const outputContainer = document.getElementById('output-container');
            const loading = document.getElementById('loading');

            loading.classList.remove('hidden');
            outputContainer.innerHTML = '';

            try {
                const response = await fetch('../index.php?action=compute');
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.status === 'success') {
                    let html = '<table class="matrix-table">';
                    data.result.forEach(row => {
                        html += '<tr>';
                        row.forEach(val => {
                            html += `<td>${Number(val).toFixed(2)}</td>`;
                        });
                        html += '</tr>';
                    });
                    html += '</table>';
                    outputContainer.innerHTML = html;
                } else {
                    outputContainer.innerHTML = `<p class="error">Error: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                loading.classList.add('hidden');
                outputContainer.innerHTML = `<p class="error">Failed to connect to PHP backend.</p>`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
